<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="theme-color" content="#151515">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>VIT Bhopal - VTOP</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
            user-select: none;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000000;
        }

        /* Dark Mode Chrome Header - Flush to top */
        .chrome-header {
            display: flex;
            align-items: center;
            height: 56px;
            background-color: #151515; 
            color: #e3e3e3;
            gap: 4px;
            padding-left: 8px;
            padding-right: 8px;
        }

        .material-symbols-outlined {
            font-size: 24px;
            padding: 8px;
            cursor: pointer;
            color: #e3e3e3;
        }

        .url-bar {
            display: flex;
            align-items: center;
            flex-grow: 1;
            height: 40px;
            background-color: #282a2d;
            border-radius: 20px;
            padding: 0 12px 0 4px;
            margin-left: 4px;
            margin-right: 4px;
            overflow: hidden;
        }

        .url-bar .material-symbols-outlined {
            font-size: 20px;
            padding: 8px;
            color: #c4c7c5;
        }

        .url-text {
            font-size: 16px;
            color: #e3e3e3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: clip;
            flex-grow: 1;
            letter-spacing: 0.2px;
        }

        .tab-wrapper {
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tab-count {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 20px;
            height: 20px;
            border: 2px solid #e3e3e3;
            border-radius: 5px;
            color: #e3e3e3;
            font-size: 11px;
            font-weight: 700;
        }

        .iframe-container {
            height: calc(100% - 56px);
            width: 100%;
            -webkit-overflow-scrolling: touch;
            background-color: #ffffff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Fullscreen Overlay Prompt */
        .fullscreen-prompt {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #151515;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            cursor: pointer;
        }
        
        .fullscreen-prompt h2 {
            font-weight: 400;
            margin-bottom: 12px;
        }

        .fullscreen-prompt p {
            color: #8ab4f8;
            font-size: 16px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Tap Anywhere Overlay -->
    <div class="fullscreen-prompt" id="fsPrompt" onclick="goFullscreen()">
        <h2>Portal Ready</h2>
        <p>Tap anywhere to launch</p>
    </div>

    <!-- Fake Chrome Header -->
    <div class="chrome-header">
        <span class="material-symbols-outlined">home</span>
        <div class="url-bar">
            <span class="material-symbols-outlined">tune</span>
            <span class="url-text">vtop.vitbhopal.ac.in/v</span>
        </div>
        <span class="material-symbols-outlined">add</span>
        <div class="tab-wrapper">
            <div class="tab-count">22</div>
        </div>
        <span class="material-symbols-outlined">more_vert</span>
    </div>

    <!-- The Actual Webpage Content -->
    <div class="iframe-container">
        <iframe src="https://dikshitajit76-ui.github.io/vtopmain/"></iframe>
    </div>

    <!-- JavaScript Fullscreen Function -->
    <script>
        function goFullscreen() {
            let elem = document.documentElement;
            
            // Request system fullscreen
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }

            // Hide the prompt and reveal the fake browser
            document.getElementById('fsPrompt').style.display = 'none';
        }
    </script>
</body>
</html>
